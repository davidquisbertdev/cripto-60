# Configuración local de Supabase CLI (supabase start / supabase functions serve).
project_id = "cripto-trader"

[api]
port = 54321

[db]
port = 54322
major_version = 15

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
# Registro cerrado: las cuentas se crean al activar la suscripción (ver migrations/*_suscripcion.sql)
enable_signup = false

[auth.email]
enable_confirmations = true

[functions.motor]
# El proyecto firma las sesiones con claves asimétricas (ES256) y la verificación del gateway solo
# entiende las antiguas (HS256): rechazaría a todos con 401. La función valida al usuario ella misma
# (auth.getUser) y comprueba la suscripción antes de ejecutar nada.
verify_jwt = false
